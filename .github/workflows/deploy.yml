name: Deploy to GitHub Pages

# Deploiement manuel tant que le site n'est pas valide par le bureau.
# Ajouter le bloc `push: { branches: [master] }` ci-dessous pour deployer
# automatiquement a chaque merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_BASE_PATH doit valoir le sous-chemin de publication.
      # Repo servi sur https://<org>.github.io/site  -> "/site"
      # Nom de domaine dedie (CNAME)                 -> "" (chaine vide)
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
