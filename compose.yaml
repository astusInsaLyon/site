services:
  # Site construit puis servi par nginx, comme en production.
  # docker compose up web  ->  http://localhost:8081
  web:
    build:
      context: .
      args:
        # Vide : site servi a la racine. Mettre /site pour reproduire GitHub Pages.
        NEXT_PUBLIC_BASE_PATH: ""
    ports:
      - "8081:80"

  # Serveur de developpement avec rechargement a chaud.
  # docker compose --profile dev up dev  ->  http://localhost:3000
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      # Volumes anonymes : les node_modules et le cache du conteneur ne
      # remplacent pas ceux de la machine hote (binaires Linux vs Windows).
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
